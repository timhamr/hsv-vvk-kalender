name: Kalender aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"   # alle 6 Stunden
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Nur echte Änderungen committen
        run: |
          # DTSTAMP ändert sich bei jedem Lauf; ohne inhaltliche Änderung nichts committen
          if git diff --quiet -I '^DTSTAMP:' -- docs/hsv.ics; then
            git checkout -- docs/hsv.ics
            echo "Keine Änderung auf hsv.de"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hsv.ics
          git commit -m "Kalender aktualisiert"
          git push
